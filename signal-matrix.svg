<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="350" fill="#18181A" rx="12"/>

  <!-- Subtle Grid Pattern -->
  <path d="M0,70 L800,70 M0,140 L800,140 M0,210 L800,210 M0,280 L800,280" stroke="#252528" stroke-width="1"/>
  <path d="M200,0 L200,350 M400,0 L400,350 M600,0 L600,350" stroke="#252528" stroke-width="1"/>

  <!-- TOP: Master Signal Input Block -->
  <rect x="250" y="20" width="300" height="55" fill="#222226" stroke="#00D2FF" stroke-width="2" rx="8"/>
  <text x="400" y="42" fill="#00D2FF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">ONE MASTER SIGNAL</text>
  <text x="400" y="60" fill="#88888C" font-family="monospace" font-size="10" text-anchor="middle">Audio / Automation / LFO / MIDI CC</text>

  <!-- Master Source Waveform -->
  <path d="M 270,47 Q 310,25 350,47 T 430,47 T 510,47" fill="none" stroke="#00D2FF" stroke-width="1.5" opacity="0.6"/>

  <!-- Main Signal Bus Downward -->
  <path d="M 400,75 L 400,105" stroke="#00D2FF" stroke-width="2.5"/>
  <polygon points="395,105 405,105 400,112" fill="#00D2FF"/>

  <!-- CENTER: Transfer Engine (1 to N Matrix) -->
  <rect x="200" y="112" width="400" height="36" fill="#2D2D32" stroke="#3A3A40" stroke-width="1.5" rx="6"/>
  <text x="400" y="134" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="12" text-anchor="middle" letter-spacing="1.5">SIGNAL RACK MATRIX (1 ➔ N TRANSFER)</text>

  <!-- Fan-out Bus Lines -->
  <path d="M 400,148 L 400,165" stroke="#55555A" stroke-width="2"/>
  <path d="M 110,165 L 690,165" stroke="#55555A" stroke-width="2"/>
  
  <path d="M 110,165 L 110,180" stroke="#FF9900" stroke-width="2"/>
  <path d="M 290,165 L 290,180" stroke="#00FF88" stroke-width="2"/>
  <path d="M 470,165 L 470,180" stroke="#FF007A" stroke-width="2"/>
  <path d="M 650,165 L 650,180" stroke="#B066FF" stroke-width="2"/>

  <!-- BRANCH 1: FILTER LIGHT -->
  <rect x="35" y="180" width="150" height="135" fill="#222226" stroke="#FF9900" stroke-width="1.5" rx="6"/>
  <text x="110" y="202" fill="#FF9900" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">FILTER LIGHT</text>
  <text x="110" y="220" fill="#77777C" font-family="monospace" font-size="9" text-anchor="middle">Smooth + Curve</text>
  <!-- Output Wave: Smooth Soft Curve -->
  <path d="M 50,270 C 80,240 100,290 130,250 L 170,270" fill="none" stroke="#FF9900" stroke-width="2" stroke-linecap="round"/>
  <text x="110" y="300" fill="#AAAAAA" font-family="monospace" font-size="9" text-anchor="middle">___//// (Smooth)</text>

  <!-- BRANCH 2: ROBOT / HW -->
  <rect x="215" y="180" width="150" height="135" fill="#222226" stroke="#00FF88" stroke-width="1.5" rx="6"/>
  <text x="290" y="202" fill="#00FF88" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ROBOT / DMX</text>
  <text x="290" y="220" fill="#77777C" font-family="monospace" font-size="9" text-anchor="middle">Jitter + Wet 30%</text>
  <!-- Output Wave: Stepped/Noisy -->
  <path d="M 230,270 L 245,240 L 255,260 L 270,230 L 285,270 L 300,245 L 320,265 L 350,270" fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round"/>
  <text x="290" y="300" fill="#AAAAAA" font-family="monospace" font-size="9" text-anchor="middle">****~~~ (Jitter)</text>

  <!-- BRANCH 3: CAMERA -->
  <rect x="395" y="180" width="150" height="135" fill="#222226" stroke="#FF007A" stroke-width="1.5" rx="6"/>
  <text x="470" y="202" fill="#FF007A" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CAMERA 3D</text>
  <text x="470" y="220" fill="#77777C" font-family="monospace" font-size="9" text-anchor="middle">Delay + Remap</text>
  <!-- Output Wave: Delayed S-Curve -->
  <path d="M 410,280 L 440,280 C 470,280 470,230 500,230 L 530,230" fill="none" stroke="#FF007A" stroke-width="2" stroke-linecap="round"/>
  <text x="470" y="300" fill="#AAAAAA" font-family="monospace" font-size="9" text-anchor="middle">__//// (Delayed)</text>

  <!-- BRANCH 4: ABLETON FX -->
  <rect x="575" y="180" width="150" height="135" fill="#222226" stroke="#B066FF" stroke-width="1.5" rx="6"/>
  <text x="650" y="202" fill="#B066FF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ABLETON FX</text>
  <text x="650" y="220" fill="#77777C" font-family="monospace" font-size="9" text-anchor="middle">Quantize / Step</text>
  <!-- Output Wave: Staircase -->
  <path d="M 590,280 L 610,280 L 610,260 L 630,260 L 630,240 L 660,240 L 660,270 L 710,270" fill="none" stroke="#B066FF" stroke-width="2" stroke-linecap="round"/>
  <text x="650" y="300" fill="#AAAAAA" font-family="monospace" font-size="9" text-anchor="middle">***__ (Quantized)</text>

  <!-- BOTTOM FOOTER -->
  <text x="400" y="338" fill="#55555A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1.5">SAME SOURCE SIGNAL ➔ DIFFERENT BEHAVIORAL OUTPUTS</text>
</svg>
