<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="250" fill="#18181A" rx="12"/>

  <!-- Subtle Grid Pattern -->
  <path d="M0,50 L800,50 M0,100 L800,100 M0,150 L800,150 M0,200 L800,200" stroke="#252528" stroke-width="1"/>
  <path d="M200,0 L200,250 M400,0 L400,250 M600,0 L600,250" stroke="#252528" stroke-width="1"/>

  <!-- LEFT: Audio Input -->
  <text x="120" y="80" fill="#00D2FF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">AUDIO INPUT</text>
  
  <!-- Waveform Visual -->
  <path d="M 30,135 Q 50,80 70,135 T 110,135 T 150,135 T 190,135" fill="none" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40,135 Q 60,100 80,135 T 120,135 T 160,135" fill="none" stroke="#00D2FF" stroke-width="1.5" opacity="0.4"/>

  <!-- CENTER: Signal Rack Core -->
  <rect x="270" y="50" width="260" height="150" fill="#222226" stroke="#3A3A40" stroke-width="2" rx="8"/>
  <text x="400" y="95" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="26" text-anchor="middle" letter-spacing="3">SIGNAL RACK</text>
  <text x="400" y="118" fill="#00FF88" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="1.5">AUDIO ➔ CV / MODULATION</text>

  <!-- Internal Controls (ENV, BPF, SMOOTH) -->
  <circle cx="330" cy="155" r="12" fill="none" stroke="#00FF88" stroke-width="2.5"/>
  <line x1="330" y1="155" x2="330" y2="147" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round"/>
  <text x="330" y="180" fill="#888888" font-family="monospace" font-size="9" text-anchor="middle">ENV</text>

  <circle cx="400" cy="155" r="12" fill="none" stroke="#FF9900" stroke-width="2.5"/>
  <line x1="400" y1="155" x2="406" y2="149" stroke="#FF9900" stroke-width="2.5" stroke-linecap="round"/>
  <text x="400" y="180" fill="#888888" font-family="monospace" font-size="9" text-anchor="middle">BPF</text>

  <circle cx="470" cy="155" r="12" fill="none" stroke="#FF007A" stroke-width="2.5"/>
  <line x1="470" y1="155" x2="478" y2="155" stroke="#FF007A" stroke-width="2.5" stroke-linecap="round"/>
  <text x="470" y="180" fill="#888888" font-family="monospace" font-size="9" text-anchor="middle">SMOOTH</text>

  <!-- RIGHT: Modulation Targets -->
  <text x="680" y="80" fill="#FF007A" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">MOD TARGETS</text>

  <!-- Parameter Controls -->
  <circle cx="630" cy="135" r="16" fill="none" stroke="#FF007A" stroke-width="3" stroke-dasharray="75 25"/>
  <text x="630" y="170" fill="#AAAAAA" font-family="monospace" font-size="10" text-anchor="middle">CUTOFF</text>

  <circle cx="730" cy="135" r="16" fill="none" stroke="#FF9900" stroke-width="3" stroke-dasharray="50 50"/>
  <text x="730" y="170" fill="#AAAAAA" font-family="monospace" font-size="10" text-anchor="middle">SPRAY</text>

  <!-- Signal Flow Connections -->
  <!-- Left to Center (Audio In) -->
  <path d="M 190,135 L 270,135" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Center to Right (Control Signals Out) -->
  <path d="M 530,125 C 570,125 580,135 611,135" fill="none" stroke="#FF007A" stroke-width="2.5"/>
  <path d="M 530,145 C 580,145 650,135 711,135" fill="none" stroke="#FF9900" stroke-width="2.5"/>
</svg>
